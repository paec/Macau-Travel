<body>
<header class="hero"><div class="wrap"><a class="back-home" href="index.html" aria-label="返回首頁">← 返回首頁</a><span class="eyebrow">🇲🇴 MACAU · DAY 1 · 旅行規劃</span><h1>澳門第一天</h1><p>2026/9/28（一）從高雄小港機場出發，抵達澳門後入住新濠影滙巨星滙，順著路氹飯店群完成第一晚的用餐、逛街、泳池與夜景。</p><div class="hero-meta"><span class="pill">✈️ 09:00 長榮起飛</span><span class="pill">🏨 巨星滙入住</span><span class="pill">🌃 路氹夜遊</span></div></div></header>

    overview:{route:'🚆 蓮花站 → 新濠影滙三座酒店 → 1F 迪士尼滙聚嘉年華 → 3F 泳池／水療 → 免費接駁車與園區設施',chips:['蓮花站較近','三座酒店','迪士尼主題空間','泳池分時段'],timeline:[{name:'輕軌蓮花站',note:'步行抵達'},{name:'三座酒店',note:'明星滙・巨星滙・映星滙',mode:'🏨'},{name:'1F 主題空間',note:'嘉年華與彩虹鎮',mode:'🎠'},{name:'3F 設施',note:'泳池・水療',mode:'🏊'},{name:'免費接駁',note:'依班次移動',mode:'🚌'}]},

      {name:'夢幻彩虹鎮・動物方城市',description:'1 樓輕軌站入口處有色彩繽紛的「夢幻彩虹鎮」，同區也有《動物方城市》、《艾莉絲》相關主題布置，適合搭乘輕軌前後拍照。',map:'Studio City Macau Lotus Station',tag:'輕軌入口'},
      {name:'健身房',description:'健身房 24 小時開放；07:00～22:00 有工作人員在場。健身房位於巨星滙 3 樓。',map:'Studio City Macau Fitness Center',tag:'24 小時',image:imageURL('image2'),imageFit:'contain'},
      {name:'三樓室內／室外泳池',description:'室內泳池 07:00～22:00；室外泳池 09:00～20:00。若第一晚 20:00 後才回到飯店，可改用室內泳池；3 樓水療開到 23:00。',map:'Studio City Macau Swimming Pool',tag:'分時段',image:imageURL('image5')},
      {name:'影滙之星與園區設施',description:'園區還有影滙之星 8 字摩天輪、新濠影滙水上樂園、滿紛樂園、傳奇英雄科技城、購物大道、豪華餐廳與美食小吃，以及綜藝館、戲院、水療與健身中心。',map:'Studio City Macau Golden Reel',tag:'園區亮點',image:imageURL('image3')},
      {name:'免費接駁車',description:'簡報附有 2026/7/1 起的接駁車表格；可先查由新濠影滙出發與往新濠影滙方向的班次，再決定是否以接駁車銜接機場、口岸或其他飯店。',map:'Studio City Macau Shuttle Bus',tag:'先查班次',image:imageURL('image1'),imageFit:'contain',source:{label:'官方交通資訊',url:'https://www.studiocity-macau.com/tc/getting-here#getting-here-static-page-section-free-shuttle'}}
    ],
    highlights:[
      {title:'期間限定迪士尼主題美食',description:'叢林妙妙屋旁的「嘉宴」規劃米奇造型薄餅、小熊維尼主題漢堡、奇奇與蒂蒂造型蛋糕與主題調飲；「羅浮餅廊及輕食」則以《動物方城市》為靈感推出甜甜圈、可麗露、爪爪冰棒與特色飲品。加入濠友薈會員，簡報備註寫有兩家餐廳主題餐點全單 9 折。',icon:'🍽️'},
    ],
    checks:['確認房型與 15:00 後 Check-in 規則','記下室內泳池、室外泳池與水療關門時間','安排 1F 迪士尼主題空間與輕軌入口拍照','查閱影滙之星、水上樂園及滿紛樂園是否需要預約或購票','把官方接駁車與備用交通方案存到手機'],
    links:[{label:'新濠影滙免費接駁車時刻表（簡報連結）',url:'https://sumiutravel.com/macau-studiocity-free-shuttle-bus-timetable/'},{label:'新濠影滙官方交通資訊（簡報連結）',url:'https://www.studiocity-macau.com/tc/getting-here#getting-here-static-page-section-free-shuttle'},{label:'影滙園區設施參考',url:'https://bjsmile.tw/studio-city-macau/#3_%E6%96%B0%E6%BF%A0%E5%BD%B1%E6%BB%99%E6%BB%BF%E7%B4%9B%E6%A8%82%E5%9C%92'}]
  },
]};

function hotelInfoCardHTML(stop,index){const image=stop.image||placeholder(stop.name,index+1);const fit=stop.imageFit==='contain'?' contain':'';return `<article class="hotel-info-card"><img class="hotel-info-image${fit}" src="${image}" alt="${stop.name} 圖片" loading="lazy"><div class="hotel-info-content"><h4>${stop.name}${stop.tag?`<span class="tag">${stop.tag}</span>`:''}</h4><p>${stop.description}</p><div class="stop-links"><a class="map" target="_blank" rel="noopener" href="${maps(stop.map)}">地圖 ↗</a>${sourceHTML(stop.source)}</div></div></article>`}
function hotelGroupsHTML(plan){const groups=[{title:'住宿與位置',description:'先掌握飯店位置、入住安排與抵達後的基本資訊。',indexes:[0]},{title:'館內主題空間',description:'整理大廳、主題布置與輕軌入口附近的環境。',indexes:[1,2]},{title:'館內休閒設施',description:'集中查看健身房、室內泳池與室外泳池的使用資訊。',indexes:[3,4]},{title:'園區設施與交通',description:'補充園區內其他設施與免費接駁車資訊。',indexes:[5,6]}];return `<div class="hotel-groups">${groups.map(group=>`<section class="hotel-group"><div class="hotel-group-heading"><h3>${group.title}</h3><p>${group.description}</p></div><div class="hotel-info-grid">${group.indexes.map(index=>hotelInfoCardHTML(plan.stops[index],index)).join('')}</div></section>`).join('')}</div>`}
function headerHTML(plan){return `<section class="intro"><div><div class="kicker">${plan.layout==='hotel'?'Hotel Guide':'Complete Travel Plan'}</div><h2>${plan.title}</h2><p>${plan.subtitle}</p></div><div class="metric"><strong>${plan.metric}</strong><span>${plan.layout==='hotel'?'資訊分類':'行程重點'}</span></div></section>`}
function sourceHTML(source){return source?`<a class="source-link" target="_blank" rel="noopener" href="${source.url}">${source.label} ↗</a>`:''}
function stopHTML(stop,index){const image=stop.image||placeholder(stop.name,index+1);const fit=stop.imageFit==='contain'?' contain':'';const detail=stop.detail?`<div class="stop-detail"><div class="stop-detail-heading"><span>✦</span><strong>${stop.detail.title}</strong><span>${stop.detail.place}</span></div><p>${stop.detail.description}</p></div>`:'';return `${index?'<div class="arrow"></div>':''}<article class="stop"><div class="num">${String(index+1).padStart(2,'0')}</div><img class="stop-image${fit}" src="${image}" alt="${stop.name} 圖片" loading="lazy"><div><h3>${stop.name}${stop.tag?`<span class="tag">${stop.tag}</span>`:''}</h3><p>${stop.description}</p>${detail}</div><div class="stop-links"><a class="map" target="_blank" rel="noopener" href="${maps(stop.map)}">地圖 ↗</a>${sourceHTML(stop.source)}</div></article>`}
function highlightHTML(highlight,plan){const media=highlight.image?`<img loading="lazy" src="${highlight.image}" alt="${highlight.title}">`:`<span class="text-photo-icon">${highlight.icon||'✦'}</span>`;const photoClass=highlight.image?(highlight.fit==='document'?' document':''):' text-photo';return `<section class="section-card"><div class="photo${photoClass}">${media}<span class="photo-label">${highlight.title}</span></div><h3>${highlight.title}</h3><p>${highlight.description}</p></section>`}
function overviewHTML(plan){const overview=plan.overview;if(!overview)return '';if(plan.layout==='hotel'){const scope=overview.route.replaceAll(' → ','・');return `<section class="route-overview hotel-overview" aria-label="飯店資訊總覽"><div class="section-heading overview-heading"><h2>飯店資訊總覽</h2><p>以館內環境、設施與交通資訊為主，沒有固定參觀順序。</p></div><div class="hotel-scope">${scope}</div><div class="chips">${overview.chips.map(chip=>`<span class="chip">${chip}</span>`).join('')}</div><div class="hotel-index" aria-label="飯店資訊索引">${overview.timeline.map(stop=>`<div class="hotel-index-item"><span class="hotel-index-icon">${stop.mode||'📍'}</span><div><strong>${stop.name}</strong><small>${stop.note||''}</small></div></div>`).join('')}</div></section>`}return `<section class="route-overview" aria-label="路線總覽"><div class="section-heading overview-heading"><h2>路線總覽</h2><p>先掌握整體方向，再查看下方的停靠點細節。</p></div><div class="route-text">${overview.route}</div><div class="chips">${overview.chips.map(chip=>`<span class="chip">${chip}</span>`).join('')}</div><div class="timeline" aria-label="推薦玩法時間軸">${overview.timeline.map((stop,index)=>`${index?`<div class="connector"><b>${stop.mode||'→'}</b><small>${stop.note||'移動'}</small></div>`:''}<div class="timeline-stop"><span>${stop.name}</span>${stop.note&&!index?`<small>${stop.note}</small>`:''}</div>`).join('')}</div></section>`}
function linksHTML(plan){if(!plan.links?.length)return '';const heading=plan.layout==='hotel'?'相關連結':'簡報原始連結';const description=plan.layout==='hotel'?'保留飯店交通、接駁與園區資訊的參考連結，出發前可再次確認最新內容。':'保留簡報中的官方網站與參考資料，出發前可再次確認最新資訊。';return `<div class="section-heading"><h2>${heading}</h2><p>${description}</p></div><section class="section-card link-card"><div class="link-list">${plan.links.map(link=>`<a class="reference-link" target="_blank" rel="noopener" href="${link.url}"><span>${link.label}</span><span>開啟連結 ↗</span></a>`).join('')}</div></section>`}
function renderPlan(plan){const hotel=plan.layout==='hotel';const noticeTitle=hotel?'入住與設施提醒':'行程提醒';const primaryTitle=hotel?'飯店環境與設施':'行程路線';const primaryDescription=hotel?'依資訊類別整理，不代表固定參觀順序。':'依順序列出本次行程的主要停靠點與時間細節。';const primaryContent=hotel?hotelGroupsHTML(plan):`<div class="route">${plan.stops.map(stopHTML).join('')}</div>`;const highlightTitle=hotel?'主題環境與補充資訊':'特色照片與重點';const highlightDescription=hotel?'補充飯店內的主題空間、設施與相關資訊。':'補充這套行程最具代表性的景觀、設施或備案資訊。';const checkTitle=hotel?'入住前確認':'行前確認';const checkDescription=hotel?'入住前可再次確認房務、設施時段與交通資訊。':'Checklist 狀態會保存在目前瀏覽器。';return `<section class="plan" id="${plan.id}" style="--accent:${plan.accent||'var(--blue)'}">${headerHTML(plan)}<div class="notice"><strong>${noticeTitle}：</strong>${plan.notice}</div>${overviewHTML(plan)}<div class="section-heading"><h2>${primaryTitle}</h2><p>${primaryDescription}</p></div>${primaryContent}<div class="section-heading"><h2>${highlightTitle}</h2><p>${highlightDescription}</p></div><div class="grid">${plan.highlights.map(highlight=>highlightHTML(highlight,plan)).join('')}</div>${linksHTML(plan)}<div class="section-heading"><h2>${checkTitle}</h2><p>${checkDescription}</p></div><section class="section-card"><div class="checklist">${plan.checks.map((check,index)=>`<label class="check"><input type="checkbox" data-key="${plan.id}-${index}"><span>${check}</span></label>`).join('')}</div></section></section>`}
function renderPlans(){planContainer.innerHTML=travelData.tabs.map(renderPlan).join('');restoreChecks()}
function renderTabs(){const tabs=travelData.tabs.map(plan=>`<button class="tab" data-target="${plan.id}"><span class="icon">${plan.icon}</span><span>${plan.label}</span></button>`).join('');topTabs.innerHTML=tabs;bottomTabs.innerHTML=tabs}
function showPlan(id,updateHash=true,shouldScroll=true){document.querySelectorAll('.plan').forEach(plan=>plan.classList.toggle('active',plan.id===id));document.querySelectorAll('[data-target]').forEach(tab=>tab.classList.toggle('active',tab.dataset.target===id));if(updateHash)history.replaceState(null,'','#'+id);if(shouldScroll)window.scrollTo({top:document.querySelector('.sticky-tabs').offsetTop,behavior:'smooth'})}
function restoreChecks(){document.querySelectorAll('[data-key]').forEach(checkbox=>{const key='macau-day1-'+checkbox.dataset.key;checkbox.checked=localStorage.getItem(key)==='1';checkbox.onchange=()=>localStorage.setItem(key,checkbox.checked?'1':'0')})}
renderTabs();renderPlans();document.addEventListener('click',event=>{const tab=event.target.closest('[data-target]');if(tab)showPlan(tab.dataset.target)});const planIds=travelData.tabs.map(plan=>plan.id);showPlan(planIds.includes(location.hash.slice(1))?location.hash.slice(1):planIds[0],false,false);
</script>
</body>
</html>
