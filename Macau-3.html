<body>
<header class="hero"><div class="wrap"><a class="back-home" href="index.html" aria-label="返回首頁">← 返回首頁</a><span class="eyebrow">🇲🇴 MACAU · DAY 3 · 回程整理</span><h1>澳門第三天</h1><p>2026/9/30（三）退房寄放行李後走訪官也街與氹仔古蹟，經銀河飯店回到新濠影滙取行李，搭免費接駁車前往澳門機場。</p><div class="hero-meta"><span class="pill">🍮 官也街午餐與甜點</span><span class="pill">💎 銀河水幕秀</span><span class="pill">✈️ 18:10 機場報到</span></div></div></header>

<main class="wrap main" id="planContainer"></main>

document.documentElement.style.setProperty('--hero-image',`url("${imageSources.hero}")`);

const travelData={tabs:[
  {
    id:'day3',type:'route',label:'9/30 回程',icon:'✈️',title:'第三天｜官也街、銀河水幕與返程',accent:'#008b83',subtitle:'退房寄放行李後，把最後一個上午留給官也街與氹仔古蹟，接著經銀河回新濠影滙取行李，再搭接駁車到機場。',metric:'18:10 機場報到',notice:'第三天有明確的 17:30 取行李與 18:10 Check-in 時間；官也街逛街、銀河兩場秀與影滙主題區都要以機場交通為優先。伴手禮若來不及，可改在澳門機場禁區北面閣樓層採買。',
    stops:[
      {name:'巨星滙泳池與白天景觀',time:'早上～11:00',description:'早上可在巨星滙游泳，或利用白天光線補拍飯店外觀。11:00 Check-out 後把行李寄放在飯店。',map:'Studio City Macau Swimming Pool',tag:'退房前',imageKey:'pool'},
      {name:'Check-out 與寄放行李',time:'11:00',description:'退房後確認行李寄放位置與最晚取件時間，再搭車前往官也街；建議把護照、登機資料與伴手禮採買清單隨身攜帶。',map:'Studio City Macau',tag:'固定節點',imageKey:'studio'},
      {name:'官也街午餐與散步',time:'11:30～14:40',description:'✨由飯店搭車約半小時抵達氹仔<br>✨一開始可先到附近來來超市 (google至華寶花園🚌站) <br> 😺安排約 3～3.5 小時吃午餐、逛官也街與周邊古蹟。完整順序與店家放在「官也街美食」Tab。',map:'Rua do Cunha Taipa Macau',tag:'3～3.5 小時',imageKey:'taipaMap'},
      {name:'銀河飯店｜鑽石水幕與水晶蓮花',time:'14:50～15:25',description:'由官也街走路到銀河，安排觀看兩場秀：鑽石大堂的巨型鑽石水幕秀 12:00～22:00、水晶大堂的水晶蓮花 12:15～21:45，兩者都是每 30 分鐘一次。',map:'Galaxy Macau Diamond Lobby',tag:'兩場秀'},
      {name:'返回新濠影滙｜迪士尼三大主題區',time:'16:00～16:30',description:'搭車約 22 分鐘回到新濠影滙，再補看「海、陸、空」三大主題區。',map:'Studio City Macau Disney Carnival',tag:'回飯店附近',imageKey:'ferris'},
      {name:'八方美食廣場與最後補給',time:'16:30～17:30',description:'在新濠影滙一樓八方美食廣場用餐。華人冰室在 1 樓 1108／1105A 號；許留山(芒果爽)在 1 樓 1019 號，營業約 10:00～24:00。若來不及或還不餓，就把餐點留到機場。',map:'Studio City Macau Food Court',tag:'取行李前'},
      {name:'取行李與機場接駁',time:'17:30～18:10',description:'17:30 回飯店拿行李，再搭免費接駁車前往澳門機場；簡報註記 12～25 分鐘一班，車程約 10～20 分鐘，目標 18:10 抵達機場 Check-in。',map:'Macau International Airport Shuttle Bus',tag:'不要壓線',imageKey:'shuttle',imageFit:'contain',source:{label:'官方接駁資訊',url:'https://www.studiocity-macau.com/tc/getting-here#getting-here-static-page-section-free-shuttle'}},
      {name:'澳門機場與返程',time:'18:10～21:30',description:'航班預計 20:00 起飛，約 21:30 抵達高雄小港。機上餐飲以冷麵包、三明治或起司捲等輕食為主；<br>機場餐飲可先查看濠江冰室（非禁區空間，編號 01-02-0010）。<br>若伴手禮來不及買，可到機場北面閣樓層禁區找英記餅家、鉅記餅家。',map:'Macau International Airport',tag:'20:00 起飛'}
    ],
    highlights:[{title:'氹仔最後一段散步',description:'官也街不是只吃東西，也可以順著兵房斜巷、龍環葡韻、嘉模聖母堂與氹仔牌坊走一圈，再過馬路到銀河。',imageKey:'taipaMap',fit:'document'},{title:'最後補買伴手禮',description:'回程日把機場當成備案，不需要為了買餅家犧牲 18:10 的 Check-in 緩衝。',icon:'🛍️'}],
    checks:['到飯店官網或櫃檯詢問，飯店免費接駁車到機場的時間。'],
    links:[{label:'澳門機場餐飲資訊',url:'https://www.macau-airport.com/zh/dining'},{label:'新濠影滙官方接駁資訊',url:'https://www.studiocity-macau.com/tc/getting-here#getting-here-static-page-section-free-shuttle'}]
  },

    id:'taipa',type:'guide',label:'官也街美食',icon:'🍪',title:'官也街（氹仔）｜午餐、甜點與古蹟散步',accent:'#c65b4b',subtitle:'把第三天 11:30～14:40 的氹仔行程整理成一條由東到西的路線，想吃、想買與想拍照都能快速取捨。',metric:'3～3.5 小時',notice:'官也街店家營業時間與排隊狀況會變動；簡報中的營業時間適合作為規劃基準，出發前仍應查看店家最新公告。',
    facts:[{label:'散步時間',value:'11:30～14:40'},{label:'最後接點',value:'銀河飯店'}],
    sections:[
      {title:'推薦散步順序',description:'依照圖片安排，從官也街午餐開始，沿兵房斜巷與嘉路士米耶馬路繞行氹仔舊城區，最後過馬路到銀河酒店看兩場秀。',items:['午餐＋逛（官也街）','世記咖啡：厚蛋豬扒包＋絲滑口感的奶茶','安德魯蛋撻店（氹仔店）','沿兵房斜巷前往龍環葡韻住宅式博物館','嘉模聖母堂','沿嘉路士米耶馬路繞回官也街附近','義順鮮奶：凍杏仁奶（或椰汁西米露／燉奶）','鉅記餅家（10:00 起）：必買經典杏仁餅作伴手禮','葡萄牙雪糕 → 路氹歷史館 → 檸檬車露 → 氹仔牌坊','過馬路到對面的銀河酒店：鑽石水幕秀＋水晶蓮花']},
      {title:'午餐與必吃清單',description:'把主餐與甜點分開想，才不會在官也街一開始就吃得太滿。',items:['世記咖啡：厚蛋豬扒包、瓦煲咖啡與絲滑奶茶，簡報註記為飄兒推薦必去','安德魯蛋撻店（氹仔店）：約 10:00 起，可安排成第一個甜點','義順鮮奶：凍杏仁奶、椰汁西米露或燉奶','檸檬車露：12:00～22:00，澳門首間義大利雪糕店，簡報註記連續四年獲米其林街頭小吃推薦','葡萄牙雪糕：可作為逛街中途的小份甜點']},

    ],
    highlights:[{title:'官也街路線地圖',description:'把氹仔牌坊、路氹歷史館、官也街、龍環葡韻與大潭山的位置先放在同一張圖上，現場較容易決定要不要繞路。',imageKey:'taipaMap',fit:'document'},{title:'杏仁餅伴手禮',description:'簡報整理的澳門名產之一，鉅記可作為最後採買點；入境規則仍要以台灣最新公告為準。',imageKey:'almond',fit:'document'},{title:'官也街美食空間',description:'官也街與氹仔舊城區適合把午餐、甜點與街景一起安排，留意尖峰時段座位與排隊。',imageKey:'foodCourt'}],
    links:[{label:'官也街美食與景點參考',url:'https://www.bring-you.info/zh-tw/taipa-rua-do-cunha-guide'},{label:'木偶葡國餐廳菜單',url:'https://www.openrice.com/zh/macau/r-%E6%9C%A8%E5%81%B6%E8%91%A1%E5%9C%8B%E9%A4%90%E5%BB%B3-%E6%B0%B9%E4%BB%94%E8%88%8A%E5%9F%8E%E5%8D%80-%E8%91%AB%E5%9C%8B%E8%8F%9C-r24152/menus'},{label:'官也街交通與景點參考',url:'https://utravel.com.hk/news/detail/31638?utm_source=website&utm_medium=copied_text'}],

travelData.tabs=travelData.tabs.filter(plan=>['day3','taipa'].includes(plan.id));
function header(plan){return `<section class="intro"><div><div class="kicker">${plan.type==='guide'?'Guide Content':'Daily Route'}</div><h2>${plan.title}</h2><p>${plan.subtitle}</p></div><div class="metric"><strong>${plan.metric}</strong><span>${plan.type==='guide'?'內容分類':'行程重點'}</span></div></section>`}
function sourceHTML(source){return source?`<a class="source-link" target="_blank" rel="noopener" href="${source.url}">${source.label} ↗</a>`:''}
function stopHTML(stop,index){const image=stop.imageKey?imageURL(stop.imageKey,stop.name,index+1):stop.image||placeholder(stop.name,index+1);const fit=stop.imageFit==='contain'?' contain':'';const detail=stop.detail?`<div class="stop-detail"><div class="stop-detail-heading"><span>✦</span><strong>${stop.detail.title}</strong><span>${stop.detail.place}</span></div><p>${stop.detail.description}</p></div>`:'';return `${index?'<div class="arrow"></div>':''}<article class="stop"><div class="num">${String(index+1).padStart(2,'0')}</div><img class="stop-image${fit}" src="${image}" alt="${stop.name} 圖片" loading="lazy"><div>${stop.time?`<span class="time">${stop.time}</span>`:''}<h3>${stop.name}${stop.tag?`<span class="tag">${stop.tag}</span>`:''}</h3><p>${stop.description}</p>${detail}</div><div class="stop-links"><a class="map" target="_blank" rel="noopener" href="${maps(stop.map)}">地圖 ↗</a>${sourceHTML(stop.source)}</div></article>`}
function highlightHTML(highlight,index){const image=highlight.imageKey?imageURL(highlight.imageKey,highlight.title,index+1):highlight.image||'';const media=image?`<img loading="lazy" src="${image}" alt="${highlight.title}">`:`<span class="text-photo-icon">${highlight.icon||'✦'}</span>`;const photoClass=image?(highlight.fit==='document'?' document':''):' text-photo';return `<section class="section-card"><div class="photo${photoClass}">${media}<span class="photo-label">${highlight.title}</span></div><h3>${highlight.title}</h3><p>${highlight.description}</p></section>`}
function overviewHTML(plan){const stops=plan.stops;if(!stops?.length)return '';return `<section class="route-overview" aria-label="路線總覽"><div class="section-heading overview-heading"><h2>路線總覽</h2><p>依下方行程路線整理，站點、時間與標籤會保持一致。</p></div><div class="timeline" aria-label="行程路線時間軸">${stops.map((stop,index)=>`${index?'<div class="connector"><b>→</b><small>下一站</small></div>':''}<div class="timeline-stop"><span>${stop.name}</span>${stop.time||stop.tag?`<small>${[stop.time,stop.tag].filter(Boolean).join(' · ')}</small>`:''}</div>`).join('')}</div></section>`}
function factsHTML(plan){if(!plan.facts?.length)return '';return `<section class="route-overview" aria-label="內容摘要"><div class="section-heading overview-heading"><h2>內容摘要</h2></div><div class="facts">${plan.facts.map(fact=>`<div class="fact"><strong>${fact.value}</strong><span>${fact.label}</span></div>`).join('')}</div></section>`}
function guideSectionsHTML(plan){return `<div class="section-heading"></div><div class="grid">${plan.sections.map(section=>`<section class="section-card guide-section"><h3>${section.title}</h3><p>${section.description}</p><ul>${section.items.map(item=>`<li>${item}</li>`).join('')}</ul></section>`).join('')}</div>`}
function tableHTML(plan){if(!plan.table)return '';return `<div class="section-heading"><h2>${plan.tableTitle}</h2><p>${plan.tableDescription}</p></div><section class="section-card"><div class="data-table-wrap"><table class="data-table"><thead><tr>${plan.table.headers.map(header=>`<th>${header}</th>`).join('')}</tr></thead><tbody>${plan.table.rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function linksHTML(plan){if(!plan.links?.length)return '';return `<div class="section-heading"><h2>參考連結</h2><p>保留簡報中的官方網站與參考資料，出發前可再次確認最新內容。</p></div><section class="section-card"><div class="link-list">${plan.links.map(link=>`<a class="reference-link" target="_blank" rel="noopener" href="${link.url}"><span>${link.label}</span><span>開啟連結 ↗</span></a>`).join('')}</div></section>`}
function checklistHTML(plan,title,description){return `<div class="section-heading"><h2>${title}</h2><p>${description}</p></div><section class="section-card"><div class="checklist">${plan.checks.map((check,index)=>`<label class="check"><input type="checkbox" data-key="${plan.id}-${index}"><span>${check}</span></label>`).join('')}</div></section>`}
function renderRoutePlan(plan){return `<section class="plan" id="${plan.id}" style="--accent:${plan.accent||'var(--blue)'}">${header(plan)}<div class="notice"><strong>行程提醒：</strong>${plan.notice}</div>${overviewHTML(plan)}<div class="section-heading"><h2>行程路線</h2><p>依順序列出本次行程的主要停靠點與時間細節。</p></div><div class="route">${plan.stops.map(stopHTML).join('')}</div><div class="section-heading"><h2>特色照片與重點</h2><p>補充這套行程最具代表性的景觀、設施或備案資訊。</p></div><div class="grid">${plan.highlights.map(highlightHTML).join('')}</div>${linksHTML(plan)}${checklistHTML(plan,'行前確認','Checklist 狀態會保存在目前瀏覽器。')}</section>`}
function renderGuidePlan(plan){return `<section class="plan" id="${plan.id}" style="--accent:${plan.accent||'var(--blue)'}">${header(plan)}<div class="notice"><strong>內容提醒：</strong>${plan.notice}</div>${factsHTML(plan)}${guideSectionsHTML(plan)}${tableHTML(plan)}<div class="section-heading"><h2>特色照片與重點</h2><p>最具代表性的景觀或體驗。</p></div><div class="grid">${plan.highlights.map(highlightHTML).join('')}</div>${linksHTML(plan)}${checklistHTML(plan,'整理確認','完成內容後，可再檢查資訊是否足夠獨立使用。')}</section>`}
function renderPlan(plan){return plan.type==='guide'?renderGuidePlan(plan):renderRoutePlan(plan)}
function renderPlans(){planContainer.innerHTML=travelData.tabs.map(renderPlan).join('');restoreChecks()}
function renderTabs(){const tabs=travelData.tabs.map(plan=>`<button class="tab" data-target="${plan.id}"><span class="icon">${plan.icon}</span><span>${plan.label}</span></button>`).join('');topTabs.innerHTML=tabs;bottomTabs.innerHTML=tabs}
function showPlan(id,updateHash=true,shouldScroll=true){document.querySelectorAll('.plan').forEach(plan=>plan.classList.toggle('active',plan.id===id));document.querySelectorAll('[data-target]').forEach(tab=>tab.classList.toggle('active',tab.dataset.target===id));if(updateHash)history.replaceState(null,'','#'+id);if(shouldScroll)window.scrollTo({top:document.querySelector('.sticky-tabs').offsetTop,behavior:'smooth'})}
function restoreChecks(){document.querySelectorAll('[data-key]').forEach(checkbox=>{const key='macau-day2-'+checkbox.dataset.key;checkbox.checked=localStorage.getItem(key)==='1';checkbox.onchange=()=>localStorage.setItem(key,checkbox.checked?'1':'0')})}
renderTabs();renderPlans();document.addEventListener('click',event=>{const tab=event.target.closest('[data-target]');if(tab)showPlan(tab.dataset.target)});const planIds=travelData.tabs.map(plan=>plan.id);showPlan(planIds.includes(location.hash.slice(1))?location.hash.slice(1):planIds[0],false,false);window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(planIds.includes(id))showPlan(id,false,false)});
</script>
</body>
</html>
