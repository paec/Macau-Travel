<body>
<header class="hero"><div class="wrap"><a class="back-home" href="index.html" aria-label="返回首頁">← 返回首頁</a><span class="eyebrow">🇲🇴 MACAU · SUPPLEMENT · 補充資料</span><h1>旅行補充</h1><p>把<strong>澳門輕軌</strong>、<strong>新濠影滙</strong>接駁車、飯店亮點、伴手禮規則與出發前代辦集中整理，行程中需要查資料時可直接切換到這一頁。</p><div class="hero-meta"><span class="pill">🗺️ <strong>Google</strong>/<strong>高德地圖</strong> 併用</span><span class="pill">🔌 220V／50Hz</span><span class="pill">🔌轉接頭 (<strong>Type G</strong>)</span></div></div></header>

const travelData={tabs:[
  {
    id:'transport',type:'guide',label:'交通備忘',icon:'🚉',title:'澳門交通｜輕軌與新濠影滙接駁車',accent:'#167a70',subtitle:'把簡報裡的輕軌營運時間、免費接駁車時刻、公車票價與本次現金估算集中放在一頁。',metric:'06:30～23:15',notice:'接駁車時刻表以簡報整理的 2026/7/1 起版本為基準；班距、站點與現場候車位置可能調整，出發前請再以飯店與官方公告確認。',
    facts:[{label:'輕軌營運',value:'06:30～23:15'},{label:'輕軌全長',value:'約 9.3 公里'},{label:'接駁車班距',value:'約 5～45 分鐘'}],
    sections:[
      {title:'澳門輕軌快速記憶',description:'簡報資料指出澳門輕軌氹仔線全長約 9.3 公里，共 11 個站，路線涵蓋機場、酒店與旅遊區。',items:['首班車每天約 06:30 發出','末班車每天約 23:15 發出','成人票價依站數分級：少於 3 個站約 MOP 6、少於 6 個站約 MOP 8、少於 10 個站約 MOP 10','12 歲或以下及長者票價依現場優惠規則辦理','第二天可把輕軌作為永利皇宮與其他路氹飯店間的備用交通']},
      {title:'機場與飯店接駁策略',description:'新濠影滙至澳門機場的免費接駁，是第一天抵達與第三天返程的主要備案。',items:['機場出口右手邊找「接駁巴士候車區」；第一天簡報註記 11:00～21:00、約 15～20 分鐘一班','第三天取行李後搭免費接駁到機場，簡報註記約 12～25 分鐘一班、車程約 10～20 分鐘','若飯店接駁車不合適，可採用備案：<br>• 永利皇宮: 輕軌到路氹東站，再由永利皇宮南館找接駁車<br>• 巴黎人酒店接駁車（離我們飯店比較近）']},
      {title:'現場查車三件事',description:'到站或到飯店後，先看清楚方向，不要只記得目的地名稱。',items:['確認是「由新濠影滙出發」還是「往新濠影滙」方向','確認站點是澳門機場、氹仔客運碼頭、港珠澳大橋口岸或澳門市區','確認當日最後一班與下一班距離，尤其是 21:00 後的班距可能拉長']},

travelData.tabs=travelData.tabs.filter(plan=>['transport','essentials'].includes(plan.id));
function header(plan){return `<section class="intro"><div><div class="kicker">${plan.type==='guide'?'Guide Content':'Daily Route'}</div><h2>${boldProperNames(plan.title)}</h2><p>${boldProperNames(plan.subtitle)}</p></div><div class="metric"><strong>${boldProperNames(plan.metric)}</strong><span>${plan.type==='guide'?'內容分類':'行程重點'}</span></div></section>`}
function sourceHTML(source){return source?`<a class="source-link" target="_blank" rel="noopener" href="${source.url}">${boldProperNames(source.label)} ↗</a>`:''}
function stopHTML(stop,index){const image=stop.imageKey?imageURL(stop.imageKey,stop.name,index+1):stop.image||placeholder(stop.name,index+1);const fit=stop.imageFit==='contain'?' contain':'';const detail=stop.detail?`<div class="stop-detail"><div class="stop-detail-heading"><span>✦</span><strong>${boldProperNames(stop.detail.title)}</strong><span>${boldProperNames(stop.detail.place)}</span></div><p>${boldProperNames(stop.detail.description)}</p></div>`:'';return `${index?'<div class="arrow"></div>':''}<article class="stop"><div class="num">${String(index+1).padStart(2,'0')}</div><img class="stop-image${fit}" src="${image}" alt="${stop.name} 圖片" loading="lazy"><div>${stop.time?`<span class="time">${stop.time}</span>`:''}<h3>${boldProperNames(stop.name)}${stop.tag?`<span class="tag">${stop.tag}</span>`:''}</h3><p>${boldProperNames(stop.description)}</p>${detail}</div><div class="stop-links"><a class="map" target="_blank" rel="noopener" href="${maps(stop.map)}">地圖 ↗</a>${sourceHTML(stop.source)}</div></article>`}
function highlightHTML(highlight,index){const image=highlight.imageKey?imageURL(highlight.imageKey,highlight.title,index+1):highlight.image||'';const media=image?`<img loading="lazy" src="${image}" alt="${highlight.title}">`:`<span class="text-photo-icon">${highlight.icon||'✦'}</span>`;const photoClass=image?(highlight.fit==='document'?' document':''):' text-photo';return `<section class="section-card"><div class="photo${photoClass}">${media}<span class="photo-label">${boldProperNames(highlight.title)}</span></div><h3>${boldProperNames(highlight.title)}</h3><p>${boldProperNames(highlight.description)}</p></section>`}
function overviewHTML(plan){const overview=plan.overview;if(!overview)return '';return `<section class="route-overview" aria-label="路線總覽"><div class="section-heading overview-heading"><h2>路線總覽</h2><p>先掌握整體方向，再查看下方的停靠點細節。</p></div><div class="route-text">${boldProperNames(overview.route)}</div><div class="chips">${overview.chips.map(chip=>`<span class="chip">${boldProperNames(chip)}</span>`).join('')}</div><div class="timeline" aria-label="推薦玩法時間軸">${overview.timeline.map((stop,index)=>`${index?`<div class="connector"><b>${stop.mode||'→'}</b><small>${boldProperNames(stop.note||'移動')}</small></div>`:''}<div class="timeline-stop"><span>${boldProperNames(stop.name)}</span>${stop.note&&!index?`<small>${boldProperNames(stop.note)}</small>`:''}</div>`).join('')}</div></section>`}
function factsHTML(plan){if(!plan.facts?.length)return '';return `<section class="route-overview" aria-label="內容摘要"><div class="section-heading overview-heading"><h2>摘要</h2></div><div class="facts">${plan.facts.map(fact=>`<div class="fact"><strong>${boldProperNames(fact.value)}</strong><span>${boldProperNames(fact.label)}</span></div>`).join('')}</div></section>`}
function guideSectionsHTML(plan){return `<div class="section-heading"></div><div class="grid">${plan.sections.map(section=>`<section class="section-card guide-section"><h3>${boldProperNames(section.title)}</h3><p>${boldProperNames(section.description)}</p><ul>${section.items.map(item=>`<li>${boldProperNames(item)}</li>`).join('')}</ul></section>`).join('')}</div>`}
function tableHTML(plan){if(!plan.table)return '';return `<div class="section-heading"><h2>${boldProperNames(plan.tableTitle)}</h2><p>${boldProperNames(plan.tableDescription)}</p></div><section class="section-card"><div class="data-table-wrap"><table class="data-table"><thead><tr>${plan.table.headers.map(header=>`<th>${boldProperNames(header)}</th>`).join('')}</tr></thead><tbody>${plan.table.rows.map(row=>`<tr>${row.map(cell=>`<td>${boldProperNames(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function linksHTML(plan){if(!plan.links?.length)return '';return `<div class="section-heading"><h2>參考連結</h2><p>保留簡報中的官方網站與參考資料，出發前可再次確認最新內容。</p></div><section class="section-card"><div class="link-list">${plan.links.map(link=>`<a class="reference-link" target="_blank" rel="noopener" href="${link.url}"><span>${boldProperNames(link.label)}</span><span>開啟連結 ↗</span></a>`).join('')}</div></section>`}
function checklistHTML(plan,title,description){return `<div class="section-heading"><h2>${title}</h2><p>${description}</p></div><section class="section-card"><div class="checklist">${plan.checks.map((check,index)=>`<label class="check"><input type="checkbox" data-key="${plan.id}-${index}"><span>${boldProperNames(check)}</span></label>`).join('')}</div></section>`}
function renderRoutePlan(plan){return `<section class="plan" id="${plan.id}" style="--accent:${plan.accent||'var(--blue)'}">${header(plan)}<div class="notice"><strong>行程提醒：</strong>${boldProperNames(plan.notice)}</div>${overviewHTML(plan)}<div class="section-heading"><h2>行程路線</h2><p>依順序列出本次行程的主要停靠點與時間細節。</p></div><div class="route">${plan.stops.map(stopHTML).join('')}</div><div class="section-heading"><h2>特色照片與重點</h2><p>補充這套行程最具代表性的景觀、設施或備案資訊。</p></div><div class="grid">${plan.highlights.map(highlightHTML).join('')}</div>${linksHTML(plan)}${checklistHTML(plan,'行前確認','Checklist 狀態會保存在目前瀏覽器。')}</section>`}
function renderGuidePlan(plan){return `<section class="plan" id="${plan.id}" style="--accent:${plan.accent||'var(--blue)'}">${header(plan)}<div class="notice"><strong>內容提醒：</strong>${boldProperNames(plan.notice)}</div>${factsHTML(plan)}${guideSectionsHTML(plan)}${tableHTML(plan)}${linksHTML(plan)}${checklistHTML(plan,'整理確認','完成內容後，可再檢查資訊是否足夠獨立使用。')}</section>`}
function renderPlan(plan){return plan.type==='guide'?renderGuidePlan(plan):renderRoutePlan(plan)}
function renderPlans(){planContainer.innerHTML=travelData.tabs.map(renderPlan).join('');restoreChecks()}
function renderTabs(){const tabs=travelData.tabs.map(plan=>`<button class="tab" data-target="${plan.id}"><span class="icon">${plan.icon}</span><span>${boldProperNames(plan.label)}</span></button>`).join('');topTabs.innerHTML=tabs;bottomTabs.innerHTML=tabs}
function showPlan(id,updateHash=true,shouldScroll=true){document.querySelectorAll('.plan').forEach(plan=>plan.classList.toggle('active',plan.id===id));document.querySelectorAll('[data-target]').forEach(tab=>tab.classList.toggle('active',tab.dataset.target===id));if(updateHash)history.replaceState(null,'','#'+id);if(shouldScroll){const main=document.getElementById('planContainer');const sticky=document.querySelector('.sticky-tabs');const targetY=main?main.offsetTop-(sticky?sticky.offsetHeight:0)-12:0;window.scrollTo({top:Math.max(targetY,0),left:0,behavior:'smooth'})}}
function restoreChecks(){document.querySelectorAll('[data-key]').forEach(checkbox=>{const key='macau-day2-'+checkbox.dataset.key;checkbox.checked=localStorage.getItem(key)==='1';checkbox.onchange=()=>localStorage.setItem(key,checkbox.checked?'1':'0')})}
renderTabs();renderPlans();document.addEventListener('click',event=>{const tab=event.target.closest('[data-target]');if(tab)showPlan(tab.dataset.target)});const planIds=travelData.tabs.map(plan=>plan.id);showPlan(planIds.includes(location.hash.slice(1))?location.hash.slice(1):planIds[0],false,false);window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(planIds.includes(id))showPlan(id,false,false)});
</script>
</body>
</html>
