travelData.tabs=travelData.tabs.filter(plan=>['day2','peninsula','wynn'].includes(plan.id));
function header(plan){return `<section class="intro"><div><div class="kicker">${plan.type==='guide'?'Guide Content':'Daily Route'}</div><h2>${plan.title}</h2><p>${plan.subtitle}</p></div><div class="metric"><strong>${plan.metric}</strong><span>${plan.type==='guide'?'重點':'行程重點'}</span></div></section>`}
function sourceHTML(source){return source?`<a class="source-link" target="_blank" rel="noopener" href="${source.url}">${source.label} ↗</a>`:''}
function stopHTML(stop,index){const image=stop.imageKey?imageURL(stop.imageKey,stop.name,index+1):stop.image||placeholder(stop.name,index+1);const fit=stop.imageFit==='contain'?' contain':'';const detail=stop.detail?`<div class="stop-detail"><div class="stop-detail-heading"><span>✦</span><strong>${stop.detail.title}</strong><span>${stop.detail.place}</span></div><p>${stop.detail.description}</p></div>`:'';return `${index?'<div class="arrow"></div>':''}<article class="stop"><div class="num">${String(index+1).padStart(2,'0')}</div><div class="stop-media${fit}"><img class="stop-image" src="${image}" alt="${stop.name} 圖片" loading="lazy"></div><div>${stop.time?`<span class="time">${stop.time}</span>`:''}<h3>${stop.name}${stop.tag?`<span class="tag">${stop.tag}</span>`:''}</h3><p>${stop.description}</p>${detail}</div><div class="stop-links"><a class="map" target="_blank" rel="noopener" href="${maps(stop.map)}">地圖 ↗</a>${sourceHTML(stop.source)}</div></article>`}
function highlightHTML(highlight,index){const image=highlight.imageKey?imageURL(highlight.imageKey,highlight.title,index+1):highlight.image||'';const media=image?`<img loading="lazy" src="${image}" alt="${highlight.title}">`:`<span class="text-photo-icon">${highlight.icon||'✦'}</span>`;const photoClass=image?(highlight.fit==='document'?' document':''):' text-photo';return `<section class="section-card"><div class="photo${photoClass}">${media}<span class="photo-label">${highlight.title}</span></div><h3>${highlight.title}</h3><p>${highlight.description}</p></section>`}
function overviewHTML(plan){if(!plan.stops?.length)return '';return `<section class="route-overview" aria-label="路線總覽"><div class="section-heading overview-heading"><h2>路線總覽</h2><p>以下流程直接依照下方「行程路線」的停靠順序整理，時間與內容會保持一致。</p></div><div class="timeline" aria-label="完整行程流程">${plan.stops.map((stop,index)=>`${index?'<div class="connector"><b>→</b><small>接續</small></div>':''}<div class="timeline-stop"><span>${stop.name}</span>${stop.time?`<small>${stop.time}</small>`:''}</div>`).join('')}</div></section>`}
function factsHTML(plan){if(!plan.facts?.length)return '';return `<section class="route-overview" aria-label="內容摘要"><div class="facts">${plan.facts.map(fact=>`<div class="fact"><strong>${fact.value}</strong><span>${fact.label}</span></div>`).join('')}</div></section>`}
function guideSectionsHTML(plan){return `<div class="grid">${plan.sections.map(section=>`<section class="section-card guide-section"><h3>${section.title}</h3><p>${section.description}</p><ul>${section.items.map(item=>`<li>${item}</li>`).join('')}</ul></section>`).join('')}</div>`}
function tableHTML(plan){if(!plan.table)return '';return `<div class="section-heading"><h2>${plan.tableTitle}</h2><p>${plan.tableDescription}</p></div><section class="section-card"><div class="data-table-wrap"><table class="data-table"><thead><tr>${plan.table.headers.map(header=>`<th>${header}</th>`).join('')}</tr></thead><tbody>${plan.table.rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function linksHTML(plan){if(!plan.links?.length)return '';return `<div class="section-heading"><h2>參考連結</h2><p>保留簡報中的官方網站與參考資料，出發前可再次確認最新內容。</p></div><section class="section-card"><div class="link-list">${plan.links.map(link=>`<a class="reference-link" target="_blank" rel="noopener" href="${link.url}"><span>${link.label}</span><span>開啟連結 ↗</span></a>`).join('')}</div></section>`}
function checklistHTML(plan,title,description){return `<div class="section-heading"><h2>${title}</h2><p>${description}</p></div><section class="section-card"><div class="checklist">${plan.checks.map((check,index)=>`<label class="check"><input type="checkbox" data-key="${plan.id}-${index}"><span>${check}</span></label>`).join('')}</div></section>`}
function renderRoutePlan(plan){return `<section class="plan" id="${plan.id}" style="--accent:${plan.accent||'var(--blue)'}">${header(plan)}<div class="notice"><strong>行程提醒：</strong>${plan.notice}</div>${overviewHTML(plan)}<div class="section-heading"><h2>行程路線</h2><p>依順序列出本次行程的主要停靠點與時間細節。</p></div><div class="route">${plan.stops.map(stopHTML).join('')}</div><div class="section-heading"><h2>特色照片與重點</h2><p>補充這套行程最具代表性的景觀、設施或備案資訊。</p></div><div class="grid">${plan.highlights.map(highlightHTML).join('')}</div>${linksHTML(plan)}${checklistHTML(plan,'行前確認','Checklist 狀態會保存在目前瀏覽器。')}</section>`}
function renderGuidePlan(plan){return `<section class="plan" id="${plan.id}" style="--accent:${plan.accent||'var(--blue)'}">${header(plan)}<div class="notice"><strong>內容提醒：</strong>${plan.notice}</div>${factsHTML(plan)}${guideSectionsHTML(plan)}${tableHTML(plan)}<div class="section-heading"><h2>特色照片與重點</h2><p>最具代表性的景觀或體驗。</p></div><div class="grid">${plan.highlights.map(highlightHTML).join('')}</div>${linksHTML(plan)}${checklistHTML(plan,'整理確認','完成內容後，可再檢查資訊是否足夠獨立使用。')}</section>`}
function renderPlan(plan){return plan.type==='guide'?renderGuidePlan(plan):renderRoutePlan(plan)}
function renderPlans(){planContainer.innerHTML=travelData.tabs.map(renderPlan).join('');restoreChecks()}
function renderTabs(){const tabs=travelData.tabs.map(plan=>`<button class="tab" data-target="${plan.id}"><span class="icon">${plan.icon}</span><span>${plan.label}</span></button>`).join('');topTabs.innerHTML=tabs;bottomTabs.innerHTML=tabs}
function showPlan(id,updateHash=true,shouldScroll=true){document.querySelectorAll('.plan').forEach(plan=>plan.classList.toggle('active',plan.id===id));document.querySelectorAll('[data-target]').forEach(tab=>tab.classList.toggle('active',tab.dataset.target===id));if(updateHash)history.replaceState(null,'','#'+id);if(shouldScroll)window.scrollTo({top:document.querySelector('.sticky-tabs').offsetTop,behavior:'smooth'})}
function restoreChecks(){document.querySelectorAll('[data-key]').forEach(checkbox=>{const key='macau-day2-'+checkbox.dataset.key;checkbox.checked=localStorage.getItem(key)==='1';checkbox.onchange=()=>localStorage.setItem(key,checkbox.checked?'1':'0')})}
renderTabs();renderPlans();document.addEventListener('click',event=>{const tab=event.target.closest('[data-target]');if(tab)showPlan(tab.dataset.target)});const planIds=travelData.tabs.map(plan=>plan.id);showPlan(planIds.includes(location.hash.slice(1))?location.hash.slice(1):planIds[0],false,false);window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(planIds.includes(id))showPlan(id,false,false)});
</script>
